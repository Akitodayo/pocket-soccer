<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ポケットサッカー</title>
  <link rel="stylesheet" href="style.css">
  <!-- Three.js を CDN から読み込む（ビルド作業なし） -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <!-- 16:9 の画面枠。ウィンドウに合わせて拡大縮小する -->
  <div id="game">
    <!-- 得点と残り時間 -->
    <div id="scoreboard">
      <span class="team team-blue">青</span>
      <span id="score-blue" class="score">0</span>
      <span id="timer" class="timer">3:00</span>
      <span id="score-red" class="score">0</span>
      <span class="team team-red">赤</span>
    </div>
    <div id="goal-banner" class="banner" hidden>GOAL!</div>
    <div id="message" class="message" hidden></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
